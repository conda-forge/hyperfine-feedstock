schema_version: 1

context:
  version: 1.20.0

package:
  name: hyperfine
  version: ${{ version }}

source:
  url: https://github.com/sharkdp/hyperfine/archive/v${{ version }}.tar.gz
  sha256: f90c3b096af568438be7da52336784635a962c9822f10f98e5ad11ae8c7f5c64

build:
  number: 1
  script: build

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - package_contents:
      bin:
        - hyperfine
  - script:
      - hyperfine --help

about:
  homepage: https://github.com/sharkdp/hyperfine
  repository: https://github.com/sharkdp/hyperfine
  license: MIT
  license_family: MIT
  summary: A command-line benchmarking tool
  license_file:
    - LICENSE-MIT
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - dbast
