schema_version: 1

context:
  version: "1.21.0"

package:
  name: hyperfine
  version: ${{ version }}

source:
  url: https://github.com/sharkdp/hyperfine/archive/v${{ version }}.tar.gz
  sha256: aee01125074fd5a6a556818db7bba0577edae94cbe85165daae0e778aa28348d

build:
  number: 0
  script: build

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses

tests:
  - package_contents:
      bin:
        - hyperfine
  - script:
      - hyperfine --help

about:
  homepage: https://github.com/sharkdp/hyperfine
  repository: https://github.com/sharkdp/hyperfine
  license: MIT
  license_family: MIT
  summary: A command-line benchmarking tool
  license_file:
    - LICENSE-MIT
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - dbast
